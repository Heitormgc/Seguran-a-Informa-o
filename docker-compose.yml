services:
  firewall:
    build: ./firewall
    container_name: contab-firewall
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      cliente_net:
        ipv4_address: 172.28.10.2
      dmz_net:
        ipv4_address: 172.28.20.2
    restart: unless-stopped

  
  cliente:
    build: ./cliente
    container_name: contab-cliente
    cap_add:
      - NET_ADMIN
    networks:
      cliente_net:
        ipv4_address: 172.28.10.10
    depends_on:
      - firewall


  web:
    build: ./web
    cap_add:
      - NET_ADMIN
    # image: nginx:alpine
    container_name: contab-web
    networks:
      dmz_net:
        ipv4_address: 172.28.20.10
    depends_on:
      - firewall
    restart: unless-stopped

 
  db:
    build: ./db
    container_name: contab-db
    cap_add:
      - NET_ADMIN
    environment:
      MYSQL_DATABASE: contabilidade_demo
      MYSQL_USER: app_contabil
      MYSQL_PASSWORD: ${DB_PASSWORD:-SenhaDeTeste_Altere}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootDeTeste_Altere}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      dmz_net:
        ipv4_address: 172.28.20.20
    depends_on:
      - firewall
    restart: unless-stopped


networks:
  cliente_net:
    name: contab_cliente_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
  dmz_net:
    name: contab_dmz_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.20.0/24

volumes:
  mysql_data:
